<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubblott · 3x3 Matrix Dashboard</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --panel: #161b22; --line: #30363d;
    --text: #c9d1d9; --dim: #8b949e; --accent: #79c0ff; --good: #3fb950; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--text);
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  main { width: min(880px, 92vw); margin: 32px auto; padding: 24px 28px;
         border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
  header { display: flex; align-items: baseline; justify-content: space-between;
           gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 15px; letter-spacing: .02em; color: #e6edf3; }
  .status { font-size: 12px; color: var(--dim); }
  .status::before { content: "●"; margin-right: 6px; }
  .status.online::before { color: var(--good); }
  .status.offline::before { color: var(--bad); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .label { display: block; font-size: 11px; letter-spacing: .08em;
           text-transform: uppercase; color: var(--dim); }
  .value { display: block; margin-top: 6px; font-size: 28px; line-height: 1.1; color: #7ee787; }
  .value i { margin-left: 4px; font-size: 12px; font-style: normal; color: var(--dim); }
  .chart { margin-top: 20px; }
  .bars { display: flex; align-items: flex-end; justify-content: flex-end; gap: 2px;
          height: 88px; margin-top: 8px; padding: 6px;
          border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .bar { flex: 1 1 0; min-height: 2px; border-radius: 2px; background: var(--accent); opacity: .85; }
  .controls { display: flex; gap: 10px; margin-top: 20px; }
  button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 6px;
           background: var(--good); color: #04140a; font: inherit; font-weight: 600; cursor: pointer; }
  button.secondary { background: #21262d; color: var(--text); font-weight: 400; }
  button:disabled { opacity: .5; cursor: progress; }
  .log { margin: 16px 0 0; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Hubblott · 3x3 Matrix Execution Engine</h1>
    <span id="status" class="status">connecting…</span>
  </header>

  <section class="stats">
    <div class="stat">
      <span class="label">Processed</span>
      <span class="value"><span id="processed">–</span></span>
    </div>
    <div class="stat">
      <span class="label">Throughput</span>
      <span class="value"><span id="rate">0.0</span><i>tx/s</i></span>
    </div>
    <div class="stat">
      <span class="label">Peak</span>
      <span class="value"><span id="peak">0.0</span><i>tx/s</i></span>
    </div>
  </section>

  <section class="chart">
    <span class="label">Throughput · last 60 samples (1 s each)</span>
    <div id="bars" class="bars"></div>
  </section>

  <section class="controls">
    <button id="send">Send 1 transaction</button>
    <button id="burst" class="secondary">Send 100</button>
  </section>

  <p id="log" class="log">polling /v1/matrix/telemetry every 1 s</p>
</main>

<script>
(function () {
  const SAMPLES = 60;
  const el = (id) => document.getElementById(id);
  const bars = el('bars');
  const samples = [];
  let total = null;
  let totalAt = 0;
  let peak = 0;

  function render() {
    const top = Math.max(peak, 1);
    bars.replaceChildren(...samples.map((rate) => {
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = Math.max(2, (rate / top) * 100) + '%';
      bar.title = rate.toFixed(1) + ' tx/s';
      return bar;
    }));
  }

  function setStatus(online) {
    el('status').className = 'status ' + (online ? 'online' : 'offline');
    el('status').textContent = online ? 'live' : 'offline';
  }

  async function poll() {
    try {
      const res = await fetch('/v1/matrix/telemetry', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const now = Date.now();
      if (total !== null) {
        const seconds = Math.max((now - totalAt) / 1000, 0.001);
        const rate = Math.max(0, (data.processed - total) / seconds);
        samples.push(rate);
        if (samples.length > SAMPLES) samples.shift();
        el('rate').textContent = rate.toFixed(1);
        if (rate > peak) {
          peak = rate;
          el('peak').textContent = peak.toFixed(1);
        }
      }
      total = data.processed;
      totalAt = now;
      el('processed').textContent = data.processed;
      render();
      setStatus(true);
    } catch (err) {
      setStatus(false);
      el('log').textContent = 'telemetry unavailable: ' + err.message;
    }
  }

  async function send(count) {
    el('send').disabled = true;
    el('burst').disabled = true;
    try {
      for (let sent = 0; sent < count; sent += 20) {
        const batch = Math.min(20, count - sent);
        const responses = await Promise.all(Array.from({ length: batch },
          () => fetch('/v1/matrix/ingest', { method: 'POST' })));
        el('log').textContent = 'sent ' + (sent + batch) + '/' + count +
          ' · last HTTP ' + responses[responses.length - 1].status;
      }
    } catch (err) {
      el('log').textContent = 'ingest failed: ' + err.message;
    } finally {
      el('send').disabled = false;
      el('burst').disabled = false;
      poll();
    }
  }

  el('send').addEventListener('click', () => send(1));
  el('burst').addEventListener('click', () => send(100));
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
